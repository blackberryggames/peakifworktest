<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Video Feed</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;

  background: #000;
  color: white;

  font-family: Arial, sans-serif;
}

body {
  overflow: hidden;
}

#feed {
  width: 100%;
  height: 100vh;

  overflow-y: auto;

  scroll-snap-type: y mandatory;

  scrollbar-width: none;
}

#feed::-webkit-scrollbar {
  display: none;
}

.video {
  position: relative;

  width: 100%;
  height: 100vh;

  scroll-snap-align: start;

  background: #000;

  display: flex;
  justify-content: center;
  align-items: center;
}

.player {
  width: 100%;
  height: 100%;

  max-width: 605px;

  display: flex;
  justify-content: center;
  align-items: center;
}

.player blockquote {
  margin: 0 !important;
}

.info {
  position: absolute;

  left: 20px;
  bottom: 35px;

  z-index: 10;

  max-width: 450px;

  text-shadow:
    0 1px 5px black,
    0 1px 10px black;
}

.creator {
  font-weight: bold;
  font-size: 17px;

  margin-bottom: 8px;
}

.title {
  font-size: 14px;

  line-height: 1.4;

  color: #eee;
}

.loading {
  position: fixed;

  inset: 0;

  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;
}

.loading.hidden {
  display: none;
}

.error {
  text-align: center;

  color: #ff7777;

  padding: 30px;
}

</style>

</head>

<body>

<div
  id="loading"
  class="loading"
>
  Loading videos...
</div>

<main id="feed"></main>

<script>

const WORKER =
  "https://muddy-field-9826.blackberryggames.workers.dev";

const feed =
  document.getElementById("feed");

const loading =
  document.getElementById("loading");


async function loadFeed() {

  try {

    const response =
      await fetch(
        WORKER + "/api/feed",
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    console.log(
      "Worker data:",
      data
    );

    if (
      !data.success ||
      !Array.isArray(data.videos)
    ) {

      throw new Error(
        "Invalid feed response."
      );
    }

    if (
      data.videos.length === 0
    ) {

      throw new Error(
        "No videos were returned."
      );
    }

    feed.innerHTML = "";

    for (
      const video of data.videos
    ) {

      createVideo(video);
    }

    loadTikTok();

    loading.classList.add(
      "hidden"
    );

  } catch (error) {

    console.error(error);

    loading.innerHTML = `
      <div class="error">
        <b>Unable to load videos</b>
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}


function createVideo(video) {

  const section =
    document.createElement(
      "section"
    );

  section.className =
    "video";

  /*
   * Use the embed HTML returned
   * directly by TikTok.
   */

  const player =
    document.createElement(
      "div"
    );

  player.className =
    "player";

  player.innerHTML =
    video.embedHTML || "";

  /*
   * Metadata overlay.
   */

  const info =
    document.createElement(
      "div"
    );

  info.className =
    "info";

  info.innerHTML = `
    <div class="creator">
      @${escapeHTML(
        video.author || "Unknown"
      )}
    </div>

    <div class="title">
      ${escapeHTML(
        video.title || ""
      )}
    </div>
  `;

  section.appendChild(
    player
  );

  section.appendChild(
    info
  );

  feed.appendChild(
    section
  );
}


function loadTikTok() {

  const script =
    document.createElement(
      "script"
    );

  script.src =
    "https://www.tiktok.com/embed.js";

  script.async = true;

  script.onload = () => {

    console.log(
      "TikTok embed script loaded."
    );

    /*
     * Force TikTok to scan the page
     * after the dynamically-created
     * blockquotes are inserted.
     */

    if (
      window.tiktokEmbed &&
      window.tiktokEmbed.lib
    ) {

      window.tiktokEmbed.lib.render();
    }
  };

  script.onerror = () => {

    console.error(
      "TikTok embed.js failed."
    );

  };

  document.body.appendChild(
    script
  );
}


function escapeHTML(value) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


loadFeed();

</script>

</body>

</html>
