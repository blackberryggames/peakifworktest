<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>TikTok Feed</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: #000;
  color: #fff;

  font-family: Arial, sans-serif;
}

body {
  overflow: hidden;
}

#feed {
  width: 100%;
  height: 100vh;

  overflow-y: auto;

  scroll-snap-type: y mandatory;

  scrollbar-width: none;
}

#feed::-webkit-scrollbar {
  display: none;
}

.video {
  width: 100%;
  height: 100vh;

  scroll-snap-align: start;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;
}

.video iframe {
  border: none;
}

.error {
  text-align: center;
  padding: 30px;

  color: #ff7070;
}

.loading {
  position: fixed;

  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;

  z-index: 999;

  font-size: 18px;
}

.loading.hidden {
  display: none;
}

</style>
</head>

<body>

<div id="loading" class="loading">
  Loading...
</div>

<div id="feed"></div>

<script>

const WORKER =
  "https://muddy-field-9826.blackberryggames.workers.dev";

const feed =
  document.getElementById("feed");

const loading =
  document.getElementById("loading");


async function loadFeed() {

  try {

    const response = await fetch(
      WORKER + "/api/feed",
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "Worker returned HTTP " +
        response.status
      );
    }

    const data =
      await response.json();

    console.log(
      "Feed response:",
      data
    );

    if (!data.success) {
      throw new Error(
        "Worker reported an error."
      );
    }

    if (!data.videos.length) {
      throw new Error(
        "Worker returned no videos."
      );
    }

    feed.innerHTML = "";

    let loaded = 0;

    for (const video of data.videos) {

      if (
        !video.success ||
        !video.html
      ) {

        console.warn(
          "Video failed:",
          video
        );

        continue;
      }

      const section =
        document.createElement(
          "section"
        );

      section.className =
        "video";

      section.innerHTML =
        video.html;

      feed.appendChild(
        section
      );

      loaded++;
    }

    if (loaded === 0) {

      throw new Error(
        "TikTok did not return any embeddable videos."
      );
    }

    /*
     * TikTok's returned oEmbed HTML
     * references this script.
     *
     * It must be added after the
     * embed HTML is inserted.
     */

    const script =
      document.createElement("script");

    script.src =
      "https://www.tiktok.com/embed.js";

    script.async = true;

    document.body.appendChild(
      script
    );

    loading.classList.add(
      "hidden"
    );

  } catch (error) {

    console.error(error);

    loading.innerHTML = `
      <div class="error">
        <b>Feed failed to load</b>
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}


function escapeHTML(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


loadFeed();

</script>

</body>
</html>
