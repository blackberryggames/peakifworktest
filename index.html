<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>For You — Video Feed</title>

<style>
:root {
  --bg: #000;
  --accent: #fe2c55;
  --muted: rgba(255,255,255,.65);
  box-sizing: border-box;
}

*, *::before, *::after {
  box-sizing: inherit;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button {
  font: inherit;
}

/* Header */
#topbar {
  position: fixed;
  inset: 0 0 auto;
  z-index: 50;
  padding-top: env(safe-area-inset-top, 0px);
  background: linear-gradient(to bottom, rgba(0,0,0,.65), transparent);
  pointer-events: none;
}

#topbar-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 52px;
  gap: 28px;
}

.tab {
  padding: 5px 0;
  color: var(--muted);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  pointer-events: auto;
  background: none;
  border: 0;
}

.tab.active {
  color: #fff;
  border-bottom: 2px solid #fff;
}

/* Vertical feed */
#feed {
  position: relative;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow-x: hidden;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}

#feed::-webkit-scrollbar {
  display: none;
}

.slide {
  position: relative;
  width: 100%;
  height: 100%;
  height: 100dvh;
  min-height: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  overflow: hidden;
  background: #000;
  flex-shrink: 0;
}

.vid-wrap {
  position: absolute;
  inset: 0;
  background: #000;
}

video.player {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

.thumb {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  transition: opacity .25s;
}

.thumb.gone {
  opacity: 0;
}

/* Video tap area */
.tap-overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.pause-flash {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: 6;
  width: 72px;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(0,0,0,.55);
  font-size: 28px;
  opacity: 0;
  transform: translate(-50%,-50%) scale(.7);
  transition: transform .12s, opacity .2s;
  pointer-events: none;
}

.pause-flash.show {
  opacity: 1;
  transform: translate(-50%,-50%) scale(1);
}

/* Progress */
.progress-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  z-index: 10;
  background: rgba(255,255,255,.2);
}

.progress-fill {
  width: 0;
  height: 100%;
  background: var(--accent);
}

/* Action buttons */
.actions {
  position: absolute;
  right: 12px;
  bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  z-index: 12;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: #fff;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.action-icon {
  width: 46px;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 50%;
  background: rgba(255,255,255,.14);
  backdrop-filter: blur(8px);
  font-size: 20px;
  transition: transform .12s, background .12s;
}

.action-btn:active .action-icon {
  transform: scale(.88);
}

.action-btn.liked .action-icon {
  background: rgba(254,44,85,.45);
}

.action-label {
  max-width: 64px;
  color: #fff;
  font-size: 11px;
  font-weight: 500;
  text-shadow: 0 1px 4px #000;
}

.avatar {
  width: 46px;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--accent);
  font-size: 17px;
  font-weight: 700;
}

/* Creator information */
.info {
  position: absolute;
  left: 14px;
  right: 76px;
  bottom: calc(25px + env(safe-area-inset-bottom, 0px));
  z-index: 11;
  text-shadow: 0 1px 6px #000, 0 2px 16px rgba(0,0,0,.7);
  pointer-events: none;
}

.info-author {
  margin-bottom: 6px;
  font-size: 15px;
  font-weight: 700;
}

.info-title {
  display: -webkit-box;
  overflow: hidden;
  color: #eee;
  font-size: 13px;
  line-height: 1.45;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow-wrap: anywhere;
}

.info-music {
  margin-top: 8px;
  overflow: hidden;
  color: var(--muted);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Unavailable slide */
.unavailable {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 40px;
  color: var(--muted);
  font-size: 14px;
  text-align: center;
}

.unavailable span {
  font-size: 40px;
}

/* Loading and error screen */
#screen {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 28px;
  background: #000;
  text-align: center;
}

#screen.hidden {
  display: none;
}

.spinner {
  width: 34px;
  height: 34px;
  border: 3px solid rgba(255,255,255,.15);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.screen-label {
  color: var(--muted);
  font-size: 13px;
}

.error-icon {
  font-size: 38px;
}

.error-msg {
  max-width: 320px;
  color: #ff8585;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.retry-btn {
  margin-top: 6px;
  padding: 11px 24px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

/* Position indicator */
#dots {
  position: fixed;
  top: 50%;
  right: 5px;
  z-index: 40;
  display: flex;
  flex-direction: column;
  gap: 5px;
  transform: translateY(-50%);
  pointer-events: none;
}

.dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(255,255,255,.35);
}

.dot.active {
  background: #fff;
  transform: scale(1.8);
}

@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
  *, *::before, *::after { scroll-behavior: auto !important; }
}
</style>

</head>

<body>

<header id="topbar">
  <nav id="topbar-inner" aria-label="Feed category">
    <button class="tab" type="button" data-tab="following">Following</button>
    <button class="tab active" type="button" data-tab="foryou">For You</button>
    <button class="tab" type="button" data-tab="live">Live</button>
  </nav>
</header>

<div id="screen" role="status" aria-live="polite">
  <div class="spinner"></div>
  <span class="screen-label">Connecting to video feed…</span>
</div>

<div id="dots" aria-hidden="true"></div>
<main id="feed" aria-label="Video feed"></main>

<script>
"use strict";

/* ── Cloudflare Worker configuration ────────────────────────────── */

const WORKER = "https://muddy-field-9826.blackberryggames.workers.dev";
const API_BASE = WORKER.replace(/\/+$/, "");
const API_ORIGIN = new URL(API_BASE).origin;

const feed = document.getElementById("feed");
const screen = document.getElementById("screen");
const dotsEl = document.getElementById("dots");

let slides = [];
let dots = [];
let observer = null;
let currentIdx = 0;
let requestController = null;
let retryTimer = null;

/* ── Safe helpers ────────────────────────────────────────────────── */

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function fmt(value) {
  const n = Number(value) || 0;

  if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";

  return String(n);
}

function initials(name) {
  return String(name || "?").trim().slice(0, 1).toUpperCase();
}

function apiURL(path) {
  return API_BASE + path;
}

/* Only accept media URLs from this Worker for proxy endpoints. */
function workerMediaURL(value, expectedPath) {
  if (typeof value !== "string" || !value) return null;

  try {
    const parsed = new URL(value, API_BASE);

    if (parsed.origin !== API_ORIGIN) return null;
    if (!parsed.pathname.startsWith(expectedPath)) return null;

    return parsed.href;
  } catch {
    return null;
  }
}

function streamURL(video) {
  const id = String(video.videoId || "");

  if (/^\d+$/.test(id)) {
    return apiURL("/api/video/" + id);
  }

  return workerMediaURL(video.streamUrl, "/api/video/");
}

function thumbnailURL(video) {
  const id = String(video.videoId || "");

  if (/^\d+$/.test(id)) {
    return apiURL("/api/thumb/" + id);
  }

  return workerMediaURL(video.thumbUrl, "/api/thumb/");
}

/* ── API client ──────────────────────────────────────────────────── */

async function fetchJSON(path, signal) {
  let response;

  try {
    response = await fetch(apiURL(path), {
      method: "GET",
      mode: "cors",
      cache: "no-store",
      signal,
      headers: {
        "Accept": "application/json"
      }
    });
  } catch (error) {
    if (error.name === "AbortError") throw error;

    throw new Error(
      "Could not connect to the Worker. Check its deployment, network, and CORS configuration."
    );
  }

  if (!response.ok) {
    throw new Error(
      "Worker API returned HTTP " + response.status + " at " + path
    );
  }

  const type = response.headers.get("content-type") || "";

  if (!type.toLowerCase().includes("application/json")) {
    throw new Error(
      "The Worker did not return JSON. Check the API route and deployment."
    );
  }

  try {
    return await response.json();
  } catch {
    throw new Error("The Worker returned invalid JSON.");
  }
}

/* ── Slide templates ─────────────────────────────────────────────── */

function actionsHTML(video) {
  return `
    <aside class="actions">
      <div class="action-btn" data-action="profile">
        <div class="avatar">${esc(initials(video.author))}</div>
      </div>

      <button class="action-btn" data-action="like"
              type="button" aria-pressed="false"
              aria-label="Like video">
        <span class="action-icon">❤️</span>
        <span class="action-label">${fmt(video.likes)}</span>
      </button>

      <button class="action-btn" data-action="comment"
              type="button" aria-label="Comments">
        <span class="action-icon">💬</span>
        <span class="action-label">${fmt(video.comments)}</span>
      </button>

      <button class="action-btn" data-action="share"
              type="button" aria-label="Share video">
        <span class="action-icon">↗️</span>
        <span class="action-label">${fmt(video.shares)}</span>
      </button>
    </aside>
  `;
}

function infoHTML(video) {
  const handle = video.authorHandle || video.author || "creator";
  const music = video.musicTitle || "Original sound";

  return `
    <div class="info">
      <div class="info-author">@${esc(handle)}</div>
      <div class="info-title">${esc(video.title || "")}</div>
      <div class="info-music">🎵 ${esc(music)}</div>
    </div>
  `;
}

/* ── Build each feed item ────────────────────────────────────────── */

function buildSlide(video, index) {
  const el = document.createElement("section");
  el.className = "slide";
  el.dataset.index = String(index);

  const src = streamURL(video);
  const thumbSrc = thumbnailURL(video);

  el.innerHTML = `
    ${
      src
        ? `
          <div class="vid-wrap">
            ${
              thumbSrc
                ? `<img class="thumb" src="${esc(thumbSrc)}"
                        alt="" decoding="async">`
                : ""
            }

            <video class="player"
                   playsinline
                   webkit-playsinline
                   preload="none"
                   muted
                   loop></video>

            <button class="tap-overlay"
                    type="button"
                    aria-label="Toggle video playback"
                    style="padding:0;border:0;background:transparent"></button>

            <div class="pause-flash">▶</div>

            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>
          </div>
        `
        : `
          <div class="unavailable">
            <span>📵</span>
            Video URL unavailable
          </div>
        `
    }

    ${actionsHTML(video)}
    ${infoHTML(video)}
  `;

  const player = el.querySelector(".player");

  if (player) {
    const thumbnail = el.querySelector(".thumb");
    const overlay = el.querySelector(".tap-overlay");
    const flash = el.querySelector(".pause-flash");
    const progress = el.querySelector(".progress-fill");

    el.dataset.src = src;
    player.dataset.videoId = String(video.videoId || "");

    if (thumbnail) {
      thumbnail.addEventListener("error", () => {
        thumbnail.style.display = "none";
      }, { once: true });
    }

    player.addEventListener("playing", () => {
      if (thumbnail) thumbnail.classList.add("gone");
    });

    player.addEventListener("timeupdate", () => {
      if (Number.isFinite(player.duration) && player.duration > 0) {
        progress.style.width =
          (player.currentTime / player.duration * 100) + "%";
      }
    });

    player.addEventListener("error", () => {
      console.warn(
        "Video playback failed.",
        player.dataset.videoId,
        player.error?.code
      );

      // Keep the thumbnail visible when possible.
      if (thumbnail) thumbnail.classList.remove("gone");
    });

    let flashTimer;

    overlay.addEventListener("click", async () => {
      if (player.paused) {
        activateSrc(index);

        try {
          await player.play();
          flash.textContent = "▶";
        } catch (error) {
          console.warn("Playback was blocked or unavailable:", error);
          return;
        }
      } else {
        player.pause();
        flash.textContent = "⏸";
      }

      flash.classList.add("show");
      clearTimeout(flashTimer);

      flashTimer = setTimeout(() => {
        flash.classList.remove("show");
      }, 500);
    });
  }

  /* Likes are local UI interactions, not TikTok account likes. */
  const likeButton = el.querySelector('[data-action="like"]');

  likeButton.addEventListener("click", () => {
    const liked = likeButton.classList.toggle("liked");

    likeButton.setAttribute("aria-pressed", String(liked));
    likeButton.querySelector(".action-icon").textContent =
      liked ? "❤️" : "🤍";
  });

  /* Sharing uses the original TikTok URL, not a temporary CDN URL. */
  const shareButton = el.querySelector('[data-action="share"]');

  shareButton.addEventListener("click", async () => {
    const url = typeof video.url === "string" &&
      video.url.startsWith("https://www.tiktok.com/")
      ? video.url
      : "https://www.tiktok.com/video/" +
        encodeURIComponent(String(video.videoId || ""));

    try {
      if (navigator.share) {
        await navigator.share({
          title: video.title || "Video",
          url
        });
      } else if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(url);

        const label = shareButton.querySelector(".action-label");
        label.textContent = "Copied!";

        setTimeout(() => {
          label.textContent = fmt(video.shares);
        }, 1400);
      } else {
        window.prompt("Copy this video link:", url);
      }
    } catch (error) {
      if (error.name !== "AbortError") {
        console.warn("Sharing failed:", error);
      }
    }
  });

  /* No comments API is defined by the supplied Worker. */
  el.querySelector('[data-action="comment"]').addEventListener("click", () => {
    showToast("Comments are not connected to the Worker API yet.");
  });

  return {
    el,
    video,
    player
  };
}

/* ── Lightweight toast ───────────────────────────────────────────── */

let toastTimer;

function showToast(message) {
  let toast = document.getElementById("feed-toast");

  if (!toast) {
    toast = document.createElement("div");
    toast.id = "feed-toast";

    Object.assign(toast.style, {
      position: "fixed",
      zIndex: "150",
      left: "50%",
      bottom: "calc(32px + env(safe-area-inset-bottom, 0px))",
      transform: "translateX(-50%)",
      padding: "11px 16px",
      background: "rgba(35,35,35,.95)",
      borderRadius: "9px",
      color: "#fff",
      fontSize: "13px",
      maxWidth: "85%",
      textAlign: "center"
    });

    document.body.appendChild(toast);
  }

  toast.textContent = message;
  toast.hidden = false;

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    toast.hidden = true;
  }, 2200);
}

/* ── Lazy-load nearby videos ─────────────────────────────────────── */

function activateSrc(index) {
  for (
    let i = Math.max(0, index - 1);
    i <= Math.min(slides.length - 1, index + 1);
    i++
  ) {
    const slide = slides[i];

    if (!slide?.player || !slide.el.dataset.src) continue;

    if (!slide.player.getAttribute("src")) {
      slide.player.src = slide.el.dataset.src;
      slide.player.load();
    }
  }
}

/* ── Playback ────────────────────────────────────────────────────── */

function playSlide(index) {
  slides.forEach((slide, i) => {
    const player = slide.player;
    if (!player) return;

    if (i === index) {
      // Muted playback allows autoplay on most mobile browsers.
      player.muted = true;

      activateSrc(index);

      player.play().catch(error => {
        // The user can still tap the video to start playback.
        console.debug("Autoplay unavailable:", error.message);
      });
    } else {
      player.pause();
      player.muted = true;
    }
  });
}

/* ── Active slide detection ──────────────────────────────────────── */

function setupObserver() {
  if (observer) observer.disconnect();

  if (!("IntersectionObserver" in window)) {
    playSlide(0);
    return;
  }

  observer = new IntersectionObserver(entries => {
    const visible = entries
      .filter(entry => entry.isIntersecting)
      .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];

    if (!visible || visible.intersectionRatio < 0.6) return;

    const index = Number(visible.target.dataset.index);

    if (!Number.isInteger(index) || index === currentIdx) return;

    currentIdx = index;
    setActiveDot(index);
    activateSrc(index);
    playSlide(index);
  }, {
    root: feed,
    threshold: [0.6, 0.8, 1]
  });

  slides.forEach(slide => observer.observe(slide.el));
}

/* ── Navigation dots ─────────────────────────────────────────────── */

function buildDots(count) {
  dotsEl.replaceChildren();
  dots = [];

  if (count > 20) return;

  for (let i = 0; i < count; i++) {
    const dot = document.createElement("span");

    dot.className = "dot" + (i === 0 ? " active" : "");
    dotsEl.appendChild(dot);
    dots.push(dot);
  }
}

function setActiveDot(index) {
  dots.forEach((dot, i) => {
    dot.classList.toggle("active", i === index);
  });
}

/* ── Loading and error screens ───────────────────────────────────── */

function showLoading() {
  screen.replaceChildren();

  const spinner = document.createElement("div");
  spinner.className = "spinner";

  const label = document.createElement("span");
  label.className = "screen-label";
  label.textContent = "Loading feed…";

  screen.append(spinner, label);
  screen.classList.remove("hidden");
}

function showError(message) {
  screen.replaceChildren();

  const icon = document.createElement("div");
  icon.className = "error-icon";
  icon.textContent = "📡";

  const description = document.createElement("div");
  description.className = "error-msg";
  description.textContent = message;

  const retry = document.createElement("button");
  retry.type = "button";
  retry.className = "retry-btn";
  retry.textContent = "Try again";
  retry.addEventListener("click", loadFeed);

  screen.append(icon, description, retry);
  screen.classList.remove("hidden");
}

/* ── Load feed from Cloudflare ───────────────────────────────────── */

async function loadFeed() {
  clearTimeout(retryTimer);

  if (requestController) requestController.abort();

  requestController = new AbortController();

  showLoading();

  try {
    const result = await fetchJSON("/api/feed", requestController.signal);

    if (result.success !== true || !Array.isArray(result.videos)) {
      throw new Error(
        result.error || "Unexpected response from the feed API."
      );
    }

    const videos = result.videos.filter(video => {
      return video && typeof video === "object" &&
        (streamURL(video) || video.videoId);
    });

    if (videos.length === 0) {
      throw new Error(
        "The API returned no videos. Check the Worker and TikWM API response."
      );
    }

    if (observer) {
      observer.disconnect();
      observer = null;
    }

    slides.forEach(slide => {
      if (slide.player) {
        slide.player.pause();
        slide.player.removeAttribute("src");
        slide.player.load();
      }
    });

    feed.replaceChildren();
    slides = [];
    currentIdx = 0;

    buildDots(videos.length);

    videos.forEach((video, index) => {
      const slide = buildSlide(video, index);

      slides.push(slide);
      feed.appendChild(slide.el);
    });

    feed.scrollTop = 0;

    setupObserver();
    activateSrc(0);
    playSlide(0);

    screen.classList.add("hidden");
  } catch (error) {
    if (error.name === "AbortError") return;

    console.error("Cloudflare feed error:", error);

    showError(
      error.message || "Unable to load the feed. Please try again."
    );
  }
}

/* ── Header tabs ─────────────────────────────────────────────────── */

document.querySelectorAll("[data-tab]").forEach(tab => {
  tab.addEventListener("click", () => {
    if (tab.dataset.tab !== "foryou") {
      showToast("Only the For You feed is connected.");
      return;
    }

    document.querySelectorAll("[data-tab]").forEach(item => {
      item.classList.toggle("active", item === tab);
    });

    feed.scrollTo({
      top: 0,
      behavior: "smooth"
    });

    if (!slides.length) loadFeed();
  });
});

/* ── Pause when the page is backgrounded ─────────────────────────── */

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    slides.forEach(slide => slide.player?.pause());
  } else if (slides.length) {
    playSlide(currentIdx);
  }
});

/* ── Start ───────────────────────────────────────────────────────── */

loadFeed();
</script>

</body>
</html>
