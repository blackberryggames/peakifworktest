<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Video Feed</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;

  background: #000;
  color: white;

  font-family: Arial, sans-serif;
}

body {
  overflow: hidden;
}

#feed {
  width: 100%;
  height: 100vh;

  overflow-y: auto;

  scroll-snap-type: y mandatory;

  scrollbar-width: none;
}

#feed::-webkit-scrollbar {
  display: none;
}

.video {
  position: relative;

  width: 100%;
  height: 100vh;

  scroll-snap-align: start;

  background: #000;

  display: flex;
  justify-content: center;
  align-items: center;
}

.player {
  width: 325px;
  height: 575px;

  border: none;
  border-radius: 12px;

  overflow: hidden;
}

.info {
  position: absolute;

  left: 20px;
  bottom: 35px;

  z-index: 10;

  max-width: 450px;

  text-shadow:
    0 1px 5px black,
    0 1px 10px black;
}

.creator {
  font-weight: bold;
  font-size: 17px;

  margin-bottom: 8px;
}

.title {
  font-size: 14px;

  line-height: 1.4;

  color: #eee;
}

.loading {
  position: fixed;

  inset: 0;

  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;
}

.loading.hidden {
  display: none;
}

.error {
  text-align: center;

  color: #ff7777;

  padding: 30px;
}

</style>

</head>

<body>

<div
  id="loading"
  class="loading"
>
  Loading videos...
</div>

<main id="feed"></main>

<script>

const WORKER =
  "https://muddy-field-9826.blackberryggames.workers.dev";

const feed =
  document.getElementById("feed");

const loading =
  document.getElementById("loading");


async function loadFeed() {

  try {

    const response =
      await fetch(
        WORKER + "/api/feed",
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    console.log(
      "Worker data:",
      data
    );

    if (
      !data.success ||
      !Array.isArray(data.videos)
    ) {
      throw new Error(
        "Invalid feed response."
      );
    }

    if (data.videos.length === 0) {
      throw new Error(
        "No videos were returned."
      );
    }

    feed.innerHTML = "";

    for (const video of data.videos) {
      createVideo(video);
    }

    loading.classList.add("hidden");

  } catch (error) {

    console.error(error);

    loading.innerHTML = `
      <div class="error">
        <b>Unable to load videos</b>
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}


function createVideo(video) {

  const section =
    document.createElement("section");

  section.className = "video";

  /*
   * Use an iframe with the direct
   * TikTok embed URL — far more
   * reliable than the blockquote
   * + embed.js widget approach.
   */

  if (video.embedLink) {

    const iframe =
      document.createElement("iframe");

    iframe.className = "player";

    iframe.src = video.embedLink;

    iframe.setAttribute(
      "allow",
      "autoplay; clipboard-write; encrypted-media; picture-in-picture;"
    );

    iframe.setAttribute(
      "allowfullscreen",
      ""
    );

    iframe.setAttribute(
      "loading",
      "lazy"
    );

    section.appendChild(iframe);

  } else {

    /*
     * Fallback: no embed available.
     */

    const fallback =
      document.createElement("div");

    fallback.style.cssText =
      "color:#888; font-size:14px;";

    fallback.textContent =
      "Video unavailable";

    section.appendChild(fallback);
  }

  /*
   * Metadata overlay.
   */

  const info =
    document.createElement("div");

  info.className = "info";

  info.innerHTML = `
    <div class="creator">
      @${escapeHTML(video.author || "Unknown")}
    </div>
    <div class="title">
      ${escapeHTML(video.title || "")}
    </div>
  `;

  section.appendChild(info);

  feed.appendChild(section);
}


function escapeHTML(value) {

  return String(value)
    .replaceAll("&",  "&amp;")
    .replaceAll("<",  "&lt;")
    .replaceAll(">",  "&gt;")
    .replaceAll('"',  "&quot;")
    .replaceAll("'",  "&#039;");
}


loadFeed();

</script>

</body>

</html>
